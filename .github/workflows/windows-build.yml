name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build binary with PyInstaller
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Download ffmpeg static binaries
            curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
            unzip ffmpeg.zip -d ffmpeg
            cp ffmpeg/ffmpeg-*-essentials_build/bin/ffmpeg.exe .
            cp ffmpeg/ffmpeg-*-essentials_build/bin/ffprobe.exe .
            pyinstaller --onefile --windowed --name=bpm_changer_win --icon=A_vibrant_digital_illustration_in_a_futuristic_spa.ico --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "./assets;assets" bpm_changer.py

          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ffmpeg
            pyinstaller --windowed --onedir --name=bpm_changer_mac --osx-bundle-identifier=com.captain.bpmchanger --add-binary "/opt/homebrew/bin/ffmpeg:." --add-binary "/opt/homebrew/bin/ffprobe:." bpm_changer.py && ls dist

          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            pyinstaller --onefile --name=bpm_changer_linux --add-binary "/usr/bin/ffmpeg:." --add-binary "/usr/bin/ffprobe:." bpm_changer.py
          fi
        shell: bash

      - name: Create and upload release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/bpm_changer_win.exe
          tag_name: bpm-changer-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip macOS app
        if: matrix.os == 'macos-latest'
        run: zip -r bpm_changer_mac.zip dist/bpm_changer_mac.app

      - name: Upload macOS release
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: bpm_changer_mac.zip
          tag_name: bpm-changer-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux binary
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/bpm_changer_linux
          tag_name: bpm-changer-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}