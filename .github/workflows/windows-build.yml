name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build binary with PyInstaller (Windows)
        run: |
          test -f bpm_changer.py || { echo "Missing bpm_changer.py"; exit 1; }
          test -f ./assets/A_vibrant_digital_illustration_in_a_futuristic_spa.png || { echo "Missing background image!"; exit 1; }
          pyinstaller --onefile --windowed --name=bpm_changer_win --icon=A_vibrant_digital_illustration_in_a_futuristic_spa.ico --add-data "assets/A_vibrant_digital_illustration_in_a_futuristic_spa.png;assets" bpm_changer.py
        shell: bash

      - name: Create and upload release (Windows)
        uses: softprops/action-gh-release@v1
        with:
          files: dist/bpm_changer_win.exe
          tag_name: bpm-changer-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}